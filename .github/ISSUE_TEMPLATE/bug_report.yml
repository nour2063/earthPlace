name: Bug report
description: Something isn't working — crashes, glitches, localization failures, wrong block placement, etc.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing earthPlace. Please fill in as much as you can — device and OS details are essential for AR and localization issues.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. What did you see go wrong?
      placeholder: e.g. Blocks I placed disappeared after relocalizing in the same spot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we trigger it?
      placeholder: |
        1. Open the app at <location>
        2. Localize to an existing map
        3. Place a few blocks
        4. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: e.g. Blocks should persist and reappear in the same world position.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: e.g. iPhone 15 Pro, Pixel 8
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. iOS 17.5, Android 14
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App / build version
      description: Shown on the TestFlight or Firebase build listing.
      placeholder: e.g. 1.0.0 (42)
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: AR environment
      description: Where were you when it happened?
      options:
        - Outdoors
        - Indoors
        - Mixed / moving between
    validations:
      required: false
  - type: textarea
    id: media
    attributes:
      label: Screenshots or screen recording
      description: Drag and drop any images or videos here. Recordings are extremely helpful for AR bugs.
    validations:
      required: false
